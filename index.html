<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxGrowth 外贸报价与跟单工作台 v0.5.6</title>
  <style>
    :root{
      --bg:#0B0F19;
      --panel:#111827;
      --panel2:#0F172A;
      --card:#121A2A;
      --line:#243044;
      --text:#E5E7EB;
      --muted:#94A3B8;
      --soft:#CBD5E1;
      --accent:#22C55E;
      --accent2:#14B8A6;
      --blue:#38BDF8;
      --yellow:#FBBF24;
      --red:#F87171;
      --green:#34D399;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top right, rgba(20,184,166,.12), transparent 28%), var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh;}
    .sidebar{width:260px;background:rgba(17,24,39,.92);border-right:1px solid var(--line);padding:20px 16px;position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;backdrop-filter:blur(18px)}
    .brand{padding:8px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
    .brand .logo{width:126px;height:126px;border-radius:20px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 0 28px rgba(34,197,94,.16);overflow:hidden;border:1px solid rgba(34,197,94,.18)}
    .brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
    .brand{text-align:center}
    .brand h1{font-size:15px;line-height:1.35;margin:0 0 8px}
    .brand .brand-link{color:#86EFAC;text-decoration:none;font-weight:700}
    .brand p{margin:0;color:var(--muted);font-size:12px}
    .nav{display:flex;flex-direction:column;gap:6px;}
    .nav button{border:0;background:transparent;color:var(--soft);text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:10px;transition:.18s}
    .nav button:hover{background:rgba(255,255,255,.05);color:#fff}
    .nav button.active{background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(20,184,166,.10));color:#fff;border:1px solid rgba(34,197,94,.25)}
    .sidefoot{margin-top:auto;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding:12px 10px 4px;line-height:1.7;text-align:center}
    .sidefoot a{color:#86EFAC;text-decoration:none}
    .sidefoot .contact{color:#E5E7EB;font-weight:700;margin:8px 0 6px}
    .service-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .service-tags span{border:1px solid rgba(34,197,94,.22);background:rgba(34,197,94,.08);color:#CFFFE1;border-radius:999px;padding:4px 7px;font-size:11px}
    .main{margin-left:260px;width:calc(100% - 260px);padding:26px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .topbar h2{margin:0;font-size:26px;letter-spacing:-.03em}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}
    .grid{display:grid;gap:16px}
    .stats{grid-template-columns:repeat(6,minmax(0,1fr));}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat{padding:18px}
    .stat .label{color:var(--muted);font-size:13px;margin-bottom:10px}
    .stat .num{font-size:28px;font-weight:800;letter-spacing:-.03em}
    .section{padding:18px;margin-bottom:16px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .section-title h3{margin:0;font-size:17px}
    .muted{color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:11px;padding:10px 13px;transition:.18s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
    .btn:hover{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.10)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#03110A;font-weight:800}
    .btn.danger:hover{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.5)}
    .btn.small{padding:7px 9px;border-radius:9px;font-size:12px}
    .btn.ghost{background:transparent}
    .input,.select,.textarea{width:100%;background:rgba(15,23,42,.9);border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px 12px;outline:none;}
    .textarea{min-height:84px;resize:vertical}
    .input:focus,.select:focus,.textarea:focus{border-color:rgba(34,197,94,.65);box-shadow:0 0 0 3px rgba(34,197,94,.12)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:12px 10px;border-bottom:1px solid rgba(36,48,68,.75);text-align:left;vertical-align:top;font-size:14px}
    th{color:var(--muted);font-weight:600;background:rgba(255,255,255,.025)}
    tr:hover td{background:rgba(255,255,255,.025)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    .badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:12px;border:1px solid transparent;white-space:nowrap}
    .badge.gray{background:rgba(148,163,184,.12);color:#CBD5E1;border-color:rgba(148,163,184,.25)}
    .badge.blue{background:rgba(56,189,248,.12);color:#7DD3FC;border-color:rgba(56,189,248,.25)}
    .badge.green{background:rgba(52,211,153,.12);color:#86EFAC;border-color:rgba(52,211,153,.25)}
    .badge.yellow{background:rgba(251,191,36,.12);color:#FCD34D;border-color:rgba(251,191,36,.25)}
    .badge.red{background:rgba(248,113,113,.12);color:#FDA4AF;border-color:rgba(248,113,113,.25)}
    .empty{padding:34px;text-align:center;color:var(--muted)}
    .split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:50;overflow:auto}
    .modal-backdrop.show{display:flex}
    .modal{width:min(1100px,100%);background:#0F172A;border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.55);overflow:hidden}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
    .modal-head h3{margin:0;font-size:18px}
    .modal-body{padding:20px}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
    .toast{position:fixed;right:24px;bottom:24px;background:#111827;border:1px solid rgba(34,197,94,.35);color:#fff;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);display:none;z-index:80}
    .toast.show{display:block;animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .calc-box{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);border-radius:15px;padding:14px;margin-top:12px}
    .calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
    .calc-item{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px}
    .calc-item .k{font-size:12px;color:var(--muted);margin-bottom:6px}.calc-item .v{font-weight:800}
    .doc{background:white;color:#111827;border-radius:14px;padding:34px;max-width:900px;margin:0 auto;box-shadow:0 18px 60px rgba(0,0,0,.22)}
    .doc h1{text-align:center;margin:0 0 22px;font-size:28px;letter-spacing:.08em}.doc h2{font-size:16px;margin:0 0 8px}.doc p{margin:4px 0;color:#374151;font-size:13px}.doc .doc-head{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}.doc table{color:#111827;margin-top:14px}.doc th,.doc td{border:1px solid #D1D5DB;padding:8px;font-size:12px}.doc th{background:#F3F4F6;color:#111827}.doc .total{text-align:right;font-size:18px;font-weight:800;margin-top:16px}.doc .bank{border:1px solid #D1D5DB;padding:12px;margin-top:16px;border-radius:8px}.doc .sign{text-align:right;margin-top:34px}
    .emailbox{background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;color:#E5E7EB;line-height:1.6}
    .mobile-title{display:none}

    .promo-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(34,197,94,.10),rgba(20,184,166,.05));border:1px solid rgba(34,197,94,.20);max-width:980px;padding:14px 16px;margin-bottom:14px}
    .promo-logo{width:96px;height:96px;border-radius:18px;background:rgba(0,0,0,.20);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
    .promo-logo img{width:100%;height:100%;object-fit:contain}
    .promo-title{font-size:18px;font-weight:850;letter-spacing:-.02em;margin:0 0 6px}
    .promo-card .muted{font-size:13px;line-height:1.55}
    .promo-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
    .promo-meta span{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 10px;color:var(--soft);font-size:12px}
    body.invite-locked .app{filter:blur(7px);pointer-events:none;user-select:none}
    .invite-lock{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,rgba(20,184,166,.18),rgba(2,6,23,.88) 38%,rgba(2,6,23,.96));backdrop-filter:blur(10px)}
    .invite-lock.show{display:flex}
    .invite-panel{width:min(460px,100%);border:1px solid rgba(34,197,94,.24);border-radius:26px;background:linear-gradient(180deg,rgba(15,23,42,.94),rgba(2,6,23,.96));box-shadow:0 24px 80px rgba(0,0,0,.55);padding:28px}
    .invite-panel .mini-logo{width:82px;height:82px;border-radius:20px;overflow:hidden;border:1px solid rgba(34,197,94,.22);margin-bottom:18px;background:rgba(0,0,0,.2)}
    .invite-panel .mini-logo img{width:100%;height:100%;object-fit:contain}
    .invite-panel h2{font-size:24px;line-height:1.25;margin:0 0 8px;letter-spacing:-.03em}
    .invite-panel p{color:var(--muted);line-height:1.7;margin:0 0 18px}
    .invite-panel .invite-actions{display:flex;gap:10px;margin-top:12px}
    .invite-error{min-height:20px;color:#FCA5A5;font-size:13px;margin-top:10px}
    .invite-contact{margin:10px 0 12px;padding:10px 12px;border-radius:14px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.18);color:#D1FAE5;font-size:13px;line-height:1.65}
    .invite-contact strong{color:#F8FAFC}
    .github-star-note{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:12px;line-height:1.6}
    .github-star-note a{color:#86EFAC;text-decoration:none;font-weight:800}
    .tool-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .tool-card{min-height:360px}
    .tool-card .section-title{align-items:flex-start}
    @media (max-width: 1120px){.tool-grid{grid-template-columns:1fr}}
    @media (max-width: 1120px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:1fr}.calc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width: 760px){.promo-card{grid-template-columns:1fr;max-width:100%;padding:14px}.promo-logo{width:88px;height:88px}.sidebar{display:none}.main{margin-left:0;width:100%;padding:16px}.mobile-title{display:block}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid,.form-grid.three{grid-template-columns:1fr}.topbar h2{font-size:22px}.doc{padding:20px}.doc .doc-head{grid-template-columns:1fr}.brand .logo{width:110px;height:110px}}
    .notice{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.24);color:#FDE68A;border-radius:14px;padding:12px 14px;line-height:1.6}
    .workflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    .workflow .step{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px;padding:13px}
    .workflow .step strong{display:block;margin-bottom:6px}
    .mark-doc{background:#fff;color:#111;border:1px solid #111;padding:50px;max-width:620px;margin:0 auto;text-align:center;font-family:Arial,sans-serif}
    .mark-doc .big{font-size:34px;font-weight:800;margin:16px 0;letter-spacing:.04em}
    @media (max-width: 1120px){.workflow{grid-template-columns:1fr 1fr}}
    @media print{
      body{background:#fff!important;color:#111!important}
      .sidebar,.topbar,.no-print,.modal-head,.modal-foot{display:none!important}
      .main{margin:0!important;width:100%!important;padding:0!important}
      .modal-backdrop{position:static!important;display:block!important;background:#fff!important;padding:0!important}
      .modal{border:0!important;box-shadow:none!important;width:100%!important;background:#fff!important}
      .modal-body{padding:0!important}
      .doc{box-shadow:none!important;border-radius:0!important;width:100%!important;max-width:none!important;padding:22mm!important}
    }
  </style>
</head>

function orderObj(id){return getOrders().find(o=>o.id===id)||{}}
function nextNo(prefix,arr,field){const d=today().replaceAll('-','');const count=arr.filter(x=>String(x[field]||'').startsWith(`${prefix}-${d}`)).length+1;return `${prefix}-${d}-${String(count).padStart(3,'0')}`}
function statusBadge(type,status){const map={'草稿':'gray','已发送':'blue','已确认':'green','已取消':'red','等待付款':'yellow','已收定金':'green','已完成':'green','待跟进':'yellow','已逾期':'red','未开始':'gray','生产中':'blue','待质检':'yellow','已质检':'green','未订舱':'gray','已订舱':'blue','已发货':'green','待制作':'yellow','已完成单证':'green','正常':'green','风险':'red'}; return `<span class="badge ${map[status]||'gray'}">${esc(status||'-')}</span>`}
function field(label,name,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input class="input" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,value,opts){return `<div class="field"><label>${label}</label><select class="select" name="${name}">${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function textArea(label,name,value){return `<div class="field" style="grid-column:1/-1"><label>${label}</label><textarea class="textarea" name="${name}">${esc(value||'')}</textarea></div>`}
function stat(label,num){return `<div class="card stat"><div class="label">${label}</div><div class="num">${num}</div></div>`}
function taskStatus(t){return t.status==='已完成'?'已完成':(t.followUpDate<today()?'已逾期':'待跟进')}
function orderRisk(o){return (o.deliveryDate && o.deliveryDate<today() && o.shipmentStatus!=='已发货')?'风险':'正常'}
function totalOrder(o){return Number(o.totalAmount||0)}
function calcQuote(q){const items=q.items||[];const totalCost=items.reduce((s,i)=>s+Number(i.costPrice||0)*Number(i.quantity||0),0);const totalAmount=items.reduce((s,i)=>s+Number(i.amount||0),0);const freight=Number(q.freightCost||0), other=Number(q.otherCost||0);const finalProfit=totalAmount-totalCost-freight-other;const finalMargin=totalAmount?finalProfit/totalAmount*100:0;return {totalCost,totalAmount,finalProfit,finalMargin}}
function itemPackFromProduct(p){return {hsCode:p.hsCode||'',cartonQty:Number(p.cartonQty||0),cartonLength:Number(p.cartonLength||0),cartonWidth:Number(p.cartonWidth||0),cartonHeight:Number(p.cartonHeight||0),cartonNW:Number(p.cartonNW||0),cartonGW:Number(p.cartonGW||0),packageInfo:p.packageInfo||''}}
function cartonCount(qty,cartonQty){return cartonQty?Math.ceil(Number(qty||0)/Number(cartonQty||1)):0}
function calcItemCbm(i){const c=Number(i.cartons||cartonCount(i.quantity,i.cartonQty)||0); return Number(i.cartonLength||0)*Number(i.cartonWidth||0)*Number(i.cartonHeight||0)*c/1000000}
function calcPackTotals(items){return (items||[]).reduce((s,i)=>{const c=Number(i.cartons||cartonCount(i.quantity,i.cartonQty)||0);s.cartons+=c;s.qty+=Number(i.quantity||0);s.nw+=Number(i.cartonNW||0)*c;s.gw+=Number(i.cartonGW||0)*c;s.cbm+=calcItemCbm({...i,cartons:c});return s},{cartons:0,qty:0,nw:0,gw:0,cbm:0})}
function downloadFile(name,content,type='application/json'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}

  <div class="section card no-print"><div class="section-title"><h3>快速操作</h3><span class="muted">常用动作入口</span></div><div class="row"><button class="btn primary" onclick="openCustomerModal()">新增客户</button><button class="btn" onclick="openProductModal()">新增产品</button><button class="btn" onclick="openQuoteModal()">新建报价</button><button class="btn" onclick="openInvoiceModal()">新建 PI</button><button class="btn" onclick="openOrderModal()">新建订单</button></div></div>
  <div class="split"><div class="section card"><div class="section-title"><h3>今日 / 逾期任务</h3><button class="btn small" onclick="setPage('tasks')">查看全部</button></div>${taskMiniTable(tasks.filter(t=>taskStatus(t)!=='已完成'&&t.followUpDate<=today()).slice(0,8))}</div><div class="section card"><div class="section-title"><h3>待处理提醒</h3></div><div class="calc-grid"><div class="calc-item"><div class="k">逾期任务</div><div class="v">${overdue}</div></div><div class="calc-item"><div class="k">PI 待付款</div><div class="v">${unpaid}</div></div><div class="calc-item"><div class="k">7天内交货</div><div class="v">${shippingSoon}</div></div><div class="calc-item"><div class="k">订单风险</div><div class="v">${orders.filter(o=>orderRisk(o)==='风险').length}</div></div></div></div></div>
  <div class="split"><div class="section card"><div class="section-title"><h3>最近订单</h3><button class="btn small" onclick="setPage('orders')">查看全部</button></div>${orderMiniTable(orders.slice(-5).reverse())}</div><div class="section card"><div class="section-title"><h3>最近 PI</h3><button class="btn small" onclick="setPage('invoices')">查看全部</button></div>${invoiceMiniTable(inv.slice(-5).reverse())}</div></div>`
}
function taskMiniTable(rows){if(!rows.length)return `<div class="empty">暂无今日或逾期待跟进任务</div>`;return `<div class="table-wrap"><table><thead><tr><th>任务</th><th>客户</th><th>关联编号</th><th>日期</th><th>状态</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.taskTitle)}</td><td>${customerName(t.customerId)}</td><td>${esc(t.relatedNo)}</td><td>${t.followUpDate}</td><td>${statusBadge('t',taskStatus(t))}</td></tr>`).join('')}</tbody></table></div>`}
function invoiceMiniTable(rows){if(!rows.length)return `<div class="empty">暂无 PI</div>`;return `<div class="table-wrap"><table><thead><tr><th>编号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${i.piNo}</td><td>${customerName(i.customerId)}</td><td>${money(i.totalAmount,i.currency)}</td><td>${statusBadge('i',i.status)}</td></tr>`).join('')}</tbody></table></div>`}

function customersHTML(){const rows=getCustomers();return `<div class="section card"><div class="section-title"><h3>客户列表</h3><div class="row"><input class="input" id="searchInput" placeholder="搜索客户名称、联系人、国家..." style="width:280px"><button class="btn primary" onclick="openCustomerModal()">新增客户</button></div></div><div class="table-wrap"><table id="dataTable"><thead><tr><th>公司名称</th><th>联系人</th><th>国家/地区</th><th>邮箱</th><th>WhatsApp</th><th>类型</th><th>操作</th></tr></thead><tbody>${rows.map(c=>`<tr data-search="${esc(Object.values(c).join(' ').toLowerCase())}"><td>${esc(c.companyName)}</td><td>${esc(c.contactPerson)}</td><td>${esc(c.country)}</td><td>${esc(c.email)}</td><td>${esc(c.whatsapp)}</td><td>${esc(c.customerType)}</td><td><div class="row"><button class="btn small" onclick="openCustomerModal('${c.id}')">编辑</button><button class="btn small" onclick="openQuoteModal(null,'${c.id}')">新建报价</button><button class="btn small danger" onclick="deleteCustomer('${c.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function openCustomerModal(id){const c=id?getCustomers().find(x=>x.id===id):{};openModal(id?'编辑客户':'新增客户',`<form id="customerForm"><div class="form-grid">${field('公司名称 *','companyName',c.companyName||'')}${field('联系人','contactPerson',c.contactPerson||'')}${field('邮箱','email',c.email||'','email')}${field('WhatsApp','whatsapp',c.whatsapp||'')}${field('国家 / 地区','country',c.country||'')}${selectField('客户类型','customerType',c.customerType||'分销商',['分销商','批发商','进口商','终端客户','工程商','品牌商','其他'])}${field('公司地址','address',c.address||'')}${textArea('备注','notes',c.notes||'')}</div></form>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCustomer('${id||''}')">保存</button>`)}
function saveCustomer(id){const data=Object.fromEntries(new FormData($('#customerForm')).entries());if(!data.companyName.trim())return toast('请填写公司名称');let rows=getCustomers();if(id){rows=rows.map(x=>x.id===id?{...x,...data,updatedAt:today()}:x)}else{rows.push({id:uid(),...data,createdAt:today(),updatedAt:today()})}saveCustomers(rows);closeModal();toast('客户已保存');render()}

function productsHTML(){const rows=getProducts();return `<div class="section card"><div class="section-title"><h3>产品列表</h3><div class="row"><input class="input" id="searchInput" placeholder="搜索产品名称、型号、HS Code..." style="width:280px"><button class="btn primary" onclick="openProductModal()">新增产品</button></div></div><div class="notice" style="margin-bottom:12px">v0.5 新增包装字段：每箱数量、箱规、单箱净重/毛重。后续订单、Packing List、CBM 会自动带出。</div><div class="table-wrap"><table id="dataTable"><thead><tr><th>产品</th><th>型号</th><th>单价</th><th>HS Code</th><th>每箱数量</th><th>箱规 cm</th><th>单箱毛重</th><th>操作</th></tr></thead><tbody>${rows.map(p=>`<tr data-search="${esc(Object.values(p).join(' ').toLowerCase())}"><td>${esc(p.productName)}</td><td>${esc(p.model)}</td><td>${money(p.defaultUnitPrice,p.currency)}</td><td>${esc(p.hsCode||'-')}</td><td>${esc(p.cartonQty||'-')}</td><td>${p.cartonLength||0}×${p.cartonWidth||0}×${p.cartonHeight||0}</td><td>${esc(p.cartonGW||'-')} kg</td><td><div class="row"><button class="btn small" onclick="openProductModal('${p.id}')">编辑</button><button class="btn small" onclick="openQuoteModal('${p.id}')">加入报价</button><button class="btn small danger" onclick="deleteProduct('${p.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function openProductModal(id){const p=id?getProducts().find(x=>x.id===id):{};openModal(id?'编辑产品':'新增产品',`<form id="productForm"><div class="form-grid three">${field('产品名称 *','productName',p.productName||'')}${field('型号','model',p.model||'')}${field('HS Code','hsCode',p.hsCode||'')}${textArea('规格参数','specification',p.specification||'')}${field('成本价','costPrice',p.costPrice||0,'number')}${field('默认销售单价','defaultUnitPrice',p.defaultUnitPrice||0,'number')}${selectField('币种','currency',p.currency||getSettings().defaultCurrency,['USD','EUR','RMB','GBP'])}${field('MOQ','moq',p.moq||'')}${field('包装方式','packageInfo',p.packageInfo||'')}${field('每箱数量 Qty/Carton','cartonQty',p.cartonQty||0,'number')}${field('长 L cm','cartonLength',p.cartonLength||0,'number')}${field('宽 W cm','cartonWidth',p.cartonWidth||0,'number')}${field('高 H cm','cartonHeight',p.cartonHeight||0,'number')}${field('单箱净重 N.W. kg','cartonNW',p.cartonNW||0,'number')}${field('单箱毛重 G.W. kg','cartonGW',p.cartonGW||0,'number')}${textArea('产品备注','notes',p.notes||'')}</div></form>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProduct('${id||''}')">保存</button>`)}
function saveProduct(id){const data=Object.fromEntries(new FormData($('#productForm')).entries());if(!data.productName.trim())return toast('请填写产品名称');['costPrice','defaultUnitPrice','cartonQty','cartonLength','cartonWidth','cartonHeight','cartonNW','cartonGW'].forEach(k=>data[k]=Number(data[k]||0));let rows=getProducts();if(id){rows=rows.map(x=>x.id===id?{...x,...data,updatedAt:today()}:x)}else{rows.push({id:uid(),...data,createdAt:today(),updatedAt:today()})}saveProducts(rows);closeModal();toast('产品已保存');render()}
function deleteProduct(id){if(!confirm('确认删除该产品吗？'))return;saveProducts(getProducts().filter(x=>x.id!==id));toast('删除成功');render()}

function quotationsHTML(){const rows=getQuotations().slice().reverse();return `<div class="section card"><div class="section-title"><h3>报价单列表</h3><div class="row"><input class="input" id="searchInput" placeholder="搜索报价编号、客户..." style="width:280px"><button class="btn primary" onclick="openQuoteModal()">新建报价单</button></div></div><div class="table-wrap"><table id="dataTable"><thead><tr><th>编号</th><th>日期</th><th>客户</th><th>金额</th><th>利润率</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(q=>{const c=calcQuote(q);return `<tr data-search="${esc((q.quotationNo+' '+customerName(q.customerId)).toLowerCase())}"><td>${q.quotationNo}</td><td>${q.date}</td><td>${customerName(q.customerId)}</td><td>${money(c.totalAmount,q.currency)}</td><td>${c.finalMargin.toFixed(1)}%</td><td>${statusBadge('q',q.status)}</td><td><div class="row"><button class="btn small" onclick="openQuoteModal(null,null,'${q.id}')">编辑</button><button class="btn small" onclick="duplicateQuote('${q.id}')">复制</button><button class="btn small" onclick="previewQuotation('${q.id}')">预览</button><button class="btn small" onclick="quoteToInvoice('${q.id}')">转 PI</button><button class="btn small danger" onclick="deleteQuotation('${q.id}')">删除</button></div></td></tr>`}).join('')}</tbody></table></div></div>`}
function quoteFormHTML(q={},prefillProductId=null,prefillCustomerId=null){const s=getSettings(), cs=getCustomers();const items=q.items?.length?q.items:[prefillProductId?quoteItemFromProduct(productObj(prefillProductId)):{id:uid(),productId:'',productName:'',model:'',specification:'',quantity:1,unit:'pcs',costPrice:0,unitPrice:0,discount:0,amount:0}];return `<form id="quoteForm" data-id="${q.id||''}"><div class="form-grid three">${field('报价单编号','quotationNo',q.quotationNo||nextNo('QT',getQuotations(),'quotationNo'))}${field('报价日期','date',q.date||today(),'date')}<div class="field"><label>客户 *</label><select class="select" name="customerId">${cs.map(c=>`<option value="${c.id}" ${(q.customerId||prefillCustomerId)===c.id?'selected':''}>${esc(c.companyName)}</option>`).join('')}</select></div>${selectField('币种','currency',q.currency||s.defaultCurrency,['USD','EUR','RMB','GBP'])}${selectField('贸易条款','tradeTerm',q.tradeTerm||s.defaultTradeTerm,['FOB','CIF','EXW','DDP'])}${selectField('状态','status',q.status||'草稿',['草稿','已发送','已确认','已取消'])}${field('付款方式','paymentTerm',q.paymentTerm||s.defaultPaymentTerm)}${field('交期','deliveryTime',q.deliveryTime||s.defaultDeliveryTime)}${field('报价有效期','validity',q.validity||s.defaultValidity)}${field('运费','freightCost',q.freightCost||0,'number')}${field('其他费用','otherCost',q.otherCost||0,'number')}${field('目标利润率 %','targetMargin',q.targetMargin||30,'number')}${textArea('备注','remarks',q.remarks||'')}</div><div class="section-title" style="margin-top:18px"><h3>产品明细</h3><button type="button" class="btn small" onclick="addQuoteItemRow()">添加产品行</button></div><div class="table-wrap"><table><thead><tr><th>产品</th><th>名称</th><th>型号</th><th>数量</th><th>单位</th><th>成本</th><th>单价</th><th>折扣%</th><th>小计</th><th></th></tr></thead><tbody id="quoteItems">${items.map(quoteItemRow).join('')}</tbody></table></div><div class="calc-box" id="quoteCalc"></div></form>`}
function quoteItemFromProduct(p){return {id:uid(),productId:p.id||'',productName:p.productName||'',model:p.model||'',specification:p.specification||'',quantity:1,unit:'pcs',costPrice:Number(p.costPrice||0),unitPrice:Number(p.defaultUnitPrice||0),discount:0,amount:Number(p.defaultUnitPrice||0),...itemPackFromProduct(p)}}
function quoteItemRow(i){const ps=getProducts();return `<tr class="quote-item" data-id="${i.id||uid()}"><td><select class="select qi-product" onchange="fillProductRow(this)"><option value="">手动</option>${ps.map(p=>`<option value="${p.id}" ${i.productId===p.id?'selected':''}>${esc(p.productName)} / ${esc(p.model)}</option>`).join('')}</select></td><td><input class="input qi-name" value="${esc(i.productName||'')}"></td><td><input class="input qi-model" value="${esc(i.model||'')}"></td><td><input class="input qi-qty" type="number" value="${i.quantity||1}" oninput="updateQuoteCalc()"></td><td><input class="input qi-unit" value="${esc(i.unit||'pcs')}"></td><td><input class="input qi-cost" type="number" value="${i.costPrice||0}" oninput="updateQuoteCalc()"></td><td><input class="input qi-price" type="number" value="${i.unitPrice||0}" oninput="updateQuoteCalc()"></td><td><input class="input qi-discount" type="number" value="${i.discount||0}" oninput="updateQuoteCalc()"></td><td class="qi-amount">0</td><td><button type="button" class="btn small danger" onclick="this.closest('tr').remove();updateQuoteCalc()">删除</button></td><input type="hidden" class="qi-spec" value="${esc(i.specification||'')}"><input type="hidden" class="qi-hs" value="${esc(i.hsCode||'')}"><input type="hidden" class="qi-cqty" value="${esc(i.cartonQty||0)}"><input type="hidden" class="qi-l" value="${esc(i.cartonLength||0)}"><input type="hidden" class="qi-w" value="${esc(i.cartonWidth||0)}"><input type="hidden" class="qi-h" value="${esc(i.cartonHeight||0)}"><input type="hidden" class="qi-nw" value="${esc(i.cartonNW||0)}"><input type="hidden" class="qi-gw" value="${esc(i.cartonGW||0)}"></tr>`}
function openQuoteModal(prefillProductId=null,prefillCustomerId=null,id=null){const q=id?getQuotations().find(x=>x.id===id):{};openModal(id?'编辑报价单':'新建报价单',quoteFormHTML(q,prefillProductId,prefillCustomerId),`<button class="btn" onclick="closeModal()">取消</button><button class="btn" onclick="saveQuote(false)">保存</button><button class="btn primary" onclick="saveQuote(true)">保存并预览</button>`);updateQuoteCalc()}
function fillProductRow(sel){const p=productObj(sel.value);const tr=sel.closest('tr');tr.querySelector('.qi-name').value=p.productName||'';tr.querySelector('.qi-model').value=p.model||'';tr.querySelector('.qi-spec').value=p.specification||'';tr.querySelector('.qi-cost').value=p.costPrice||0;tr.querySelector('.qi-price').value=p.defaultUnitPrice||0;tr.querySelector('.qi-hs').value=p.hsCode||'';tr.querySelector('.qi-cqty').value=p.cartonQty||0;tr.querySelector('.qi-l').value=p.cartonLength||0;tr.querySelector('.qi-w').value=p.cartonWidth||0;tr.querySelector('.qi-h').value=p.cartonHeight||0;tr.querySelector('.qi-nw').value=p.cartonNW||0;tr.querySelector('.qi-gw').value=p.cartonGW||0;updateQuoteCalc()}
function addQuoteItemRow(){$('#quoteItems').insertAdjacentHTML('beforeend',quoteItemRow({id:uid(),quantity:1,unit:'pcs'}));updateQuoteCalc()}
function collectQuoteItems(){return $$('.quote-item').map(tr=>{const qty=Number(tr.querySelector('.qi-qty').value||0), price=Number(tr.querySelector('.qi-price').value||0), discount=Number(tr.querySelector('.qi-discount').value||0);return {id:tr.dataset.id||uid(),productId:tr.querySelector('.qi-product').value,productName:tr.querySelector('.qi-name').value,model:tr.querySelector('.qi-model').value,specification:tr.querySelector('.qi-spec').value,quantity:qty,unit:tr.querySelector('.qi-unit').value,costPrice:Number(tr.querySelector('.qi-cost').value||0),unitPrice:price,discount,amount:qty*price*(1-discount/100),hsCode:tr.querySelector('.qi-hs').value,cartonQty:Number(tr.querySelector('.qi-cqty').value||0),cartonLength:Number(tr.querySelector('.qi-l').value||0),cartonWidth:Number(tr.querySelector('.qi-w').value||0),cartonHeight:Number(tr.querySelector('.qi-h').value||0),cartonNW:Number(tr.querySelector('.qi-nw').value||0),cartonGW:Number(tr.querySelector('.qi-gw').value||0)}})}
function updateQuoteCalc(){const f=$('#quoteForm');if(!f)return;const items=collectQuoteItems();$$('.quote-item').forEach((tr,i)=>tr.querySelector('.qi-amount').textContent=(items[i]?.amount||0).toFixed(2));const q={items,freightCost:Number(f.freightCost?.value||0),otherCost:Number(f.otherCost?.value||0)};const c=calcQuote(q);const target=Number(f.targetMargin?.value||30);const suggested=(c.totalCost+Number(q.freightCost)+Number(q.otherCost))/(1-target/100);$('#quoteCalc').innerHTML=`<div class="section-title" style="margin:0 0 8px"><h3>利润测算</h3><span class="muted">报价时看毛利，转订单后看交付</span></div><div class="calc-grid"><div class="calc-item"><div class="k">总成本</div><div class="v">${c.totalCost.toFixed(2)}</div></div><div class="calc-item"><div class="k">销售额</div><div class="v">${c.totalAmount.toFixed(2)}</div></div><div class="calc-item"><div class="k">最终利润</div><div class="v">${c.finalProfit.toFixed(2)}</div></div><div class="calc-item"><div class="k">利润率</div><div class="v">${c.finalMargin.toFixed(1)}%</div></div><div class="calc-item"><div class="k">建议销售总价</div><div class="v">${isFinite(suggested)?suggested.toFixed(2):'0.00'}</div></div></div>`}
function saveQuote(preview){const f=$('#quoteForm');const data=Object.fromEntries(new FormData(f).entries());const items=collectQuoteItems().filter(i=>i.productName);if(!data.customerId)return toast('请选择客户');if(!items.length)return toast('请至少添加一个产品');const c=calcQuote({...data,items});const id=f.dataset.id;let rows=getQuotations();const q={id:id||uid(),...data,items,freightCost:Number(data.freightCost||0),otherCost:Number(data.otherCost||0),totalAmount:c.totalAmount,createdAt:id?(rows.find(x=>x.id===id)?.createdAt||today()):today(),updatedAt:today()};if(id){rows=rows.map(x=>x.id===id?q:x)}else{rows.push(q);createAutoTask(q.customerId,'报价单',q.quotationNo,'跟进报价反馈',addDays(q.date,2),'报价创建后自动生成')}saveQuotations(rows);closeModal();toast('报价单已保存');render();if(preview)previewQuotation(q.id)}
function duplicateQuote(id){const q=getQuotations().find(x=>x.id===id);if(!q)return;const rows=getQuotations();const copy={...q,id:uid(),quotationNo:q.quotationNo+'-V'+(rows.filter(x=>String(x.quotationNo).startsWith(q.quotationNo)).length+1),date:today(),status:'草稿',createdAt:today(),updatedAt:today()};rows.push(copy);saveQuotations(rows);toast('已复制为新版本');render()}
function deleteQuotation(id){if(!confirm('确认删除该报价单吗？'))return;saveQuotations(getQuotations().filter(x=>x.id!==id));toast('删除成功');render()}
function quoteToInvoice(id){const q=getQuotations().find(x=>x.id===id);if(!q)return;const inv={id:uid(),piNo:nextNo('PI',getInvoices(),'piNo'),date:today(),customerId:q.customerId,quotationId:q.id,currency:q.currency,tradeTerm:q.tradeTerm,paymentTerm:q.paymentTerm,deliveryTime:q.deliveryTime,remarks:q.remarks,items:q.items.map(i=>({...i,unitPrice:i.unitPrice,amount:i.amount})),totalAmount:calcQuote(q).totalAmount,status:'等待付款',createdAt:today(),updatedAt:today()};const rows=getInvoices();rows.push(inv);saveInvoices(rows);createInvoiceTask(inv.id);toast('已转为 PI');render();previewInvoice(inv.id)}

function saveInvoice(preview){const f=$('#invoiceForm');const data=Object.fromEntries(new FormData(f).entries());const items=collectInvoiceItems().filter(i=>i.productName);if(!data.customerId)return toast('请选择客户');if(!items.length)return toast('请至少添加一个产品');const total=items.reduce((s,i)=>s+i.amount,0);const id=f.dataset.id;let rows=getInvoices();const inv={id:id||uid(),...data,items,totalAmount:total,createdAt:id?(rows.find(x=>x.id===id)?.createdAt||today()):today(),updatedAt:today()};if(id){rows=rows.map(x=>x.id===id?inv:x)}else{rows.push(inv);createInvoiceTask(inv.id)}saveInvoices(rows);closeModal();toast('PI 已保存');render();if(preview)previewInvoice(inv.id)}

function invoiceToOrder(id){const inv=getInvoices().find(x=>x.id===id);if(!inv)return;const exists=getOrders().find(o=>o.invoiceId===id);if(exists){toast('该 PI 已经转过订单');setPage('orders');return}const order={id:uid(),orderNo:nextNo('SO',getOrders(),'orderNo'),date:today(),customerId:inv.customerId,invoiceId:inv.id,piNo:inv.piNo,currency:inv.currency,tradeTerm:inv.tradeTerm,paymentTerm:inv.paymentTerm,totalAmount:inv.totalAmount,deliveryDate:addDays(today(),25),depositStatus:'等待付款',productionStatus:'未开始',inspectionStatus:'待质检',packingStatus:'待包装',shipmentStatus:'未订舱',documentStatus:'待制作',nextAction:'确认定金到账并安排生产',items:(inv.items||[]).map(i=>({...i,cartons:cartonCount(i.quantity,i.cartonQty)})),remarks:inv.remarks||'',createdAt:today(),updatedAt:today()};const rows=getOrders();rows.push(order);saveOrders(rows);createAutoTask(order.customerId,'订单',order.orderNo,'确认定金到账并安排生产',addDays(today(),1),'PI 转订单后自动生成');toast('已转为订单');setPage('orders')}

function orderFormHTML(o={}){const cs=getCustomers(), invs=getInvoices();const items=o.items?.length?o.items:[];return `<form id="orderForm" data-id="${o.id||''}"><div class="form-grid three">${field('订单号','orderNo',o.orderNo||nextNo('SO',getOrders(),'orderNo'))}${field('订单日期','date',o.date||today(),'date')}<div class="field"><label>客户 *</label><select class="select" name="customerId">${cs.map(c=>`<option value="${c.id}" ${o.customerId===c.id?'selected':''}>${esc(c.companyName)}</option>`).join('')}</select></div><div class="field"><label>来源 PI</label><select class="select" name="invoiceId" onchange="fillOrderFromInvoice(this.value)"><option value="">手动订单</option>${invs.map(i=>`<option value="${i.id}" ${o.invoiceId===i.id?'selected':''}>${esc(i.piNo)} / ${customerName(i.customerId)}</option>`).join('')}</select></div>${field('来源 PI 编号','piNo',o.piNo||'')}${field('交期','deliveryDate',o.deliveryDate||addDays(today(),25),'date')}${selectField('币种','currency',o.currency||getSettings().defaultCurrency,['USD','EUR','RMB','GBP'])}${selectField('贸易条款','tradeTerm',o.tradeTerm||getSettings().defaultTradeTerm,['FOB','CIF','EXW','DDP'])}${field('订单金额','totalAmount',o.totalAmount||0,'number')}${selectField('定金状态','depositStatus',o.depositStatus||'等待付款',['等待付款','已收定金','已完成'])}${selectField('生产状态','productionStatus',o.productionStatus||'未开始',['未开始','生产中','已完成'])}${selectField('质检状态','inspectionStatus',o.inspectionStatus||'待质检',['待质检','已质检','无需质检'])}${selectField('包装状态','packingStatus',o.packingStatus||'待包装',['待包装','已包装'])}${selectField('发货状态','shipmentStatus',o.shipmentStatus||'未订舱',['未订舱','已订舱','已发货'])}${selectField('单证状态','documentStatus',o.documentStatus||'待制作',['待制作','已完成单证'])}${field('下一步动作','nextAction',o.nextAction||'确认定金到账并安排生产')}${textArea('备注','remarks',o.remarks||'')}</div><div class="section-title" style="margin-top:18px"><h3>订单产品与包装数据</h3><button type="button" class="btn small" onclick="addOrderItemRow()">添加产品行</button></div><div class="table-wrap"><table><thead><tr><t function orderItemRow(i){return `<tr class="order-item" data-id="${i.id||uid()}"><td><input class="input oi-name" value="${esc(i.productName||'')}"></td><td><input class="input oi-model" value="${esc(i.model||'')}"></td><td><input class="input oi-qty" type="number" value="${i.quantity||0}" oninput="updateOrderPackCalc()"></td><td><input class="input oi-unit" value="${esc(i.unit||'pcs')}"></td><td><input class="input oi-hs" value="${esc(i.hsCode||'')}"></td><td><input class="input oi-cqty" type="number" value="${i.cartonQty||0}" oninput="autoOrderCartons(this)"></td><td><input class="input oi-cartons" type="number" value="${i.cartons||cartonCount(i.quantity,i.cartonQty)}" oninput="updateOrderPackCalc()"></td><td><div class="row" style="gap:4px"><input class="input oi-l" type="number" value="${i.cartonLength||0}" oninput="updateOrderPackCalc()" style="width:70px"><input class="input oi-w" type="number" value="${i.cartonWidth||0}" oninput="updateOrderPackCalc()" style="width:70px"><input class="input oi-h" type="number" value="${i.cartonHeight||0}" oninput="updateOrderPackCalc()" style="width:70px"></div></td><td><input class="input oi-gw" type="number" value="${i.cartonGW||0}" oninput="updateOrderPackCalc()"><input type="hidden" class="oi-nw" value="${i.cartonNW||0}"><input type="hidden" class="oi-price" value="${i.unitPrice||0}"><input type="hidden" class="oi-amount" value="${i.amount||0}"><input type="hidden" class="oi-spec" value="${esc(i.specification||'')}"></td><td><button type="button" class="btn small danger" onclick="this.closest('tr').remove();updateOrderPackCalc()">删除</button></td></tr>`}

function collectOrderItems(){return $$('.order-item').map(tr=>({id:tr.dataset.id||uid(),productName:tr.querySelector('.oi-name').value,model:tr.querySelector('.oi-model').value,quantity:Number(tr.querySelector('.oi-qty').value||0),unit:tr.querySelector('.oi-unit').value,hsCode:tr.querySelector('.oi-hs').value,cartonQty:Number(tr.querySelector('.oi-cqty').value||0),cartons:Number(tr.querySelector('.oi-cartons').value||0),cartonLength:Number(tr.querySelector('.oi-l').value||0),cartonWidth:Number(tr.querySelector('.oi-w').value||0),cartonHeight:Number(tr.querySelector('.oi-h').value||0),cartonGW:Number(tr.querySelector('.oi-gw').value||0),cartonNW:Number(tr.querySelector('.oi-nw').value||0),unitPrice:Number(tr.querySelector('.oi-price').value||0),amount:Number(tr.querySelector('.oi-amount').value||0),specification:tr.querySelector('.oi-spec').value}))}

function saveOrder(){const f=$('#orderForm');const data=Object.fromEntries(new FormData(f).entries());const items=collectOrderItems().filter(i=>i.productName);if(!data.customerId)return toast('请选择客户');if(!items.length)return toast('请至少添加一个产品');['totalAmount'].forEach(k=>data[k]=Number(data[k]||0));const id=f.dataset.id;let rows=getOrders();const order={id:id||uid(),...data,items,createdAt:id?(rows.find(x=>x.id===id)?.createdAt||today()):today(),updatedAt:today()};if(id){rows=rows.map(x=>x.id===id?order:x)}else{rows.push(order);createAutoTask(order.customerId,'订单',order.orderNo,order.nextAction||'跟进订单下一步',addDays(today(),1),'订单创建后自动生成')}saveOrders(rows);closeModal();toast('订单已保存');render()}

function previewSelectedOrderDoc(type){const id=$('#docOrderId')?.value;if(!id)return toast('暂无订单，请先创建或从 PI 转订单');previewOrderDocs(id,type)}
function previewOrderDocs(id,type){const o=orderObj(id);if(!o.id)return;let title='单证预览',body='';if(type==='ci'){title='Commercial Invoice';body=commercialInvoiceDoc(o)}if(type==='pl'){title='Packing List';body=packingListDoc(o)}if(type==='mark'){title='Shipping Mark';body=shippingMarkDoc(o)}if(type==='checklist'){title='出货文件 Checklist';body=checklistDoc(o)}openModal(title,body,`<button class="btn" onclick="window.print()">打印 / 导出 PDF</button><button class="btn" onclick="closeModal()">关闭</button>`)}
function commercialInvoiceDoc(o){const s=getSettings(), c=customerObj(o.customerId), items=o.items||[];const total=o.totalAmount||items.reduce((sum,i)=>sum+Number(i.amount||0),0);return `<div class="doc"><h1>COMMERCIAL INVOICE</h1><div class="doc-head"><div><h2>Seller</h2><p><strong>${esc(s.sellerCompanyName)}</strong></p><p>${esc(s.sellerAddress)}</p><p>Email: ${esc(s.sellerEmail)}</p><p>Tel: ${esc(s.sellerPhone)}</p></div><div><h2>Buyer</h2><p><strong>${esc(c.companyName)}</strong></p><p>${esc(c.address)}</p><p>Contact: ${esc(c.contactPerson)}</p><p>Email: ${esc(c.email)}</p></div></div><div class="doc-head"><div><p><strong>Invoice No.:</strong> CI-${esc(o.orderNo)}</p><p><strong>Date:</strong> ${today()}</p><p><strong>Order No.:</strong> ${esc(o.orderNo)}</p><p><strong>PI No.:</strong> ${esc(o.piNo||'-')}</p></div><div><p><strong>Trade Term:</strong> ${esc(o.tradeTerm)}</p><p><strong>Currency:</strong> ${esc(o.currency)}</p><p><strong>Country of Origin:</strong> ${esc(s.defaultOrigin||'China')}</p></div></div><table><thead><tr><th>No.</th><th>Description</th><th>Model</th><th>HS Code</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead><tbody>${items.map((i,idx)=>`<tr><td>${idx+1}</td><td>${esc(i.productName)}</td><td>${esc(i.model)}</td><td>${esc(i.hsCode||'-')}</td><td>${i.quantity} ${esc(i.unit||'pcs')}</td><td>${money(i.unitPrice,o.currency)}</td><td>${money(i.amount||i.quantity*i.unitPrice,o.currency)}</td></tr>`).join('')}</tbody></table><div class="total">Total Amount: ${money(total,o.currency)}</div><p style="margin-top:18px"><strong>Declaration:</strong> The information stated above is true and correct.</p><div class="sign"><p>${esc(s.sellerCompanyName)}</p><p>Authorized Signature</p></div></div>`}
function packingListDoc(o){const s=getSettings(), c=customerObj(o.customerId), items=o.items||[], total=calcPackTotals(items);return `<div class="doc"><h1>PACKING LIST</h1><div class="doc-head"><div><h2>Seller</h2><p><strong>${esc(s.sellerCompanyName)}</strong></p><p>${esc(s.sellerAddress)}</p></div><div><h2>Consignee</h2><p><strong>${esc(c.companyName)}</strong></p><p>${esc(c.address)}</p></div></div><div class="doc-head"><div><p><strong>Packing List No.:</strong> PL-${esc(o.orderNo)}</p><p><strong>Date:</strong> ${today()}</p><p><strong>Order No.:</strong> ${esc(o.orderNo)}</p></div><div><p><strong>PI No.:</strong> ${esc(o.piNo||'-')}</p><p><strong>Trade Term:</strong> ${esc(o.tradeTerm)}</p></div></div><table><thead><tr><th>No.</th><th>Product</th><th>Model</th><th>Qty</th><th>Cartons</th><th>Qty/Carton</th><th>N.W.</th><th>G.W.</th><th>Carton Size</th><th>CBM</th></tr></thead><tbody>${items.map((i,idx)=>{const ctn=Number(i.cartons||cartonCount(i.quantity,i.cartonQty));return `<tr><td>${idx+1}</td><td>${esc(i.productName)}</td><td>${esc(i.model)}</td><td>${i.quantity} ${esc(i.unit||'pcs')}</td><td>${ctn}</td><td>${i.cartonQty||'-'}</td><td>${(Number(i.cartonNW||0)*ctn).toFixed(2)} kg</td><td>${(Number(i.cartonGW||0)*ctn).toFixed(2)} kg</td><td>${i.cartonLength||0}×${i.cartonWidth||0}×${i.cartonHeight||0} cm</td><td>${calcItemCbm({...i,cartons:ctn}).toFixed(3)}</td></tr>`}).join('')}</tbody></table><div class="total">Total: ${total.cartons} CTNS / ${total.gw.toFixed(2)} KG / ${total.cbm.toFixed(3)} CBM</div><div class="sign"><p>${esc(s.sellerCompanyName)}</p><p>Authorized Signature</p></div></div>`}
function shippingMarkDoc(o){const c=customerObj(o.customerId);const first=(o.items||[])[0]||{};const total=calcPackTotals(o.items||[]);return `<div class="mark-doc"><div class="big">${esc(c.companyName||'CONSIGNEE')}</div><div class="big">ORDER NO.: ${esc(o.orderNo)}</div><div class="big">PI NO.: ${esc(o.piNo||'-')}</div><div class="big">ITEM: ${esc(first.model||first.productName||'-')}</div><div class="big">C/NO.: 1-${total.cartons||1}</div><div class="big">MADE IN CHINA</div></div>`}
function checklistDoc(o){const items=o.items||[];const hs=items.map(i=>i.hsCode).filter(Boolean).join(', ')||'-';let list=['Commercial Invoice','Packing List','Bill of Lading / Air Waybill','Shipping Mark','Sales Contract / PI','Product photos and package photos'];if(o.tradeTerm==='CIF')list.push('Insurance Policy / Insurance Certificate');list.push('Certificate of Origin if required by buyer');list.push('Product certificates / test reports if required');return `<div class="doc"><h1>SHIPMENT DOCUMENT CHECKLIST</h1><p><strong>Order No.:</strong> ${esc(o.orderNo)}</p><p><strong>Customer:</strong> ${esc(customerName(o.customerId))}</p><p><strong>Trade Term:</strong> ${esc(o.tradeTerm)}</p><p><strong>HS Code:</strong> ${esc(hs)}</p><table><thead><tr><th>No.</th><th>Document</th><th>Status</th><th>Remark</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x)}</td><td>□ Pending / □ Done</td><td></td></tr>`).join('')}</tbody></table><p style="margin-top:18px">Note: Final customs clearance requirements should be confirmed with the buyer, forwarder or customs broker before shipment.</p></div>`}

function calculatorsHTML(){return `<div class="split"><div class="section card"><div class="section-title"><h3>多箱规 CBM 计算器</h3><span class="badge green">可直接算装箱</span></div><div class="table-wrap"><table><thead><tr><th>产品/箱规</th><th>长</th><th>宽</th><th>高</th><th>箱数</th><th>单箱G.W.</th><th></th></tr></thead><tbody id="cbmRows">${cbmRow({name:'Carton A',l:50,w:40,h:35,ctn:100,gw:12})}</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn" onclick="addCbmRow()">添加箱规</button><button class="btn primary" onclick="calcMultiCBM()">计算</button><button class="btn" onclick="toolCopyOutput('cbmOut')">复制结果</button></div><div id="cbmOut" style="margin-top:12px"></div></div><div class="section card"><div class="section-title"><h3>从订单带出包装数据</h3><span class="badge yellow">v0.5</span></div><p class="muted">选择订单后，可把订单中的产品箱规自动带入左侧计算器。</p><div class="field"><label>选择订单</label><select class="select" id="calcOrderId">${getOrders().map(o=>`<option value="${o.id}">${esc(o.orderNo)} / ${customerName(o.customerId)}</option>`).join('')}</select></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="loadCbmFromOrder()">从订单带出</button></div><div id="containerOut" class="calc-box" style="margin-top:12px"><div class="calc-grid"><div class="calc-item"><div class="k">20GP</div><div class="v">待计算</div></div><div class="calc-item"><div class="k">40GP</div><div class="v">待计算</div></div><div class="calc-item"><div class="k">40HQ</div><div class="v">待计算</div></div></div></div></div></div>`}
function cbmRow(r={}){return `<tr class="cbm-row"><td><input class="input cr-name" value="${esc(r.name||'')}"></td><td><input class="input cr-l" type="number" value="${r.l||0}"></td><td><input class="input cr-w" type="number" value="${r.w||0}"></td><td><input class="input cr-h" type="number" value="${r.h||0}"></td><td><input class="input cr-ctn" type="number" value="${r.ctn||0}"></td><td><input class="input cr-gw" type="number" value="${r.gw||0}"></td><td><button class="btn small danger" onclick="this.closest('tr').remove()">删除</button></td></tr>`}
function addCbmRow(){$('#cbmRows').insertAdjacentHTML('beforeend',cbmRow({}))}
function loadCbmFromOrder(){const o=orderObj($('#calcOrderId')?.value);if(!o.id)return toast('暂无订单');$('#cbmRows').innerHTML=(o.items||[]).map(i=>cbmRow({name:i.productName,l:i.cartonLength,w:i.cartonWidth,h:i.cartonHeight,ctn:i.cartons||cartonCount(i.quantity,i.cartonQty),gw:i.cartonGW})).join('');calcMultiCBM()}
function calcMultiCBM(){let total=0,gw=0,lines=[];$$('.cbm-row').forEach(r=>{const name=r.querySelector('.cr-name').value||'Item';const l=Number(r.querySelector('.cr-l').value||0),w=Number(r.querySelector('.cr-w').value||0),h=Number(r.querySelector('.cr-h').value||0),ctn=Number(r.querySelector('.cr-ctn').value||0),g=Number(r.querySelector('.cr-gw').value||0);const cbm=l*w*h*ctn/1000000;total+=cbm;gw+=g*ctn;lines.push(`${name}: ${ctn} cartons / ${cbm.toFixed(3)} CBM / ${(g*ctn).toFixed(2)} KG`)});const data=[['20GP',28],['40GP',58],['40HQ',68]];const txt=`CBM 计算结果\n\n${lines.join('\n')}\n\n总体积：${total.toFixed(3)} CBM\n总毛重：${gw.toFixed(2)} kg\n\n装柜粗估：\n${data.map(([n,v])=>`${n}: 体积占用 ${(total/v*100).toFixed(1)}%`).join('\n')}\n\n判断建议：${total<15?'更偏向 LCL 拼箱或合并出货。':total<28?'可能适合 20GP，需要再看重量。':total<58?'可能适合 40GP。':'建议评估 40HQ 或拆分出货。'}`;toolSetOutput('cbmOut',txt);$('#containerOut').innerHTML=`<div class="calc-grid">${data.map(([n,v])=>`<div class="calc-item"><div class="k">${n}</div><div class="v">${(total/v*100).toFixed(1)}%</div><div class="muted">参考容积 ${v} CBM</div></div>`).join('')}</div>`}

function tasksHTML(){const rows=getTasks().slice().reverse();return `<div class="section card"><div class="section-title"><h3>跟进任务</h3><div class="row"><input class="input" id="searchInput" placeholder="搜索任务、客户、关联编号..." style="width:280px"><button class="btn primary" onclick="openTaskModal()">新增任务</button></div></div><div class="table-wrap"><table id="dataTable"><thead><tr><th>任务</th><th>客户</th><th>关联类型</th><th>关联编号</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(t=>`<tr data-search="${esc((t.taskTitle+' '+customerName(t.customerId)+' '+t.relatedNo).toLowerCase())}"><td>${esc(t.taskTitle)}</td><td>${customerName(t.customerId)}</td><td>${esc(t.relatedType)}</td><td>${esc(t.relatedNo)}</td><td>${esc(t.followUpDate)}</td><td>${statusBadge('t',taskStatus(t))}</td><td><div class="row">${t.status!=='已完成'?`<button class="btn small" onclick="completeTask('${t.id}')">完成</button>`:''}<button class="btn small" onclick="openTaskModal('${t.id}')">编辑</button><button class="btn small danger" onclick="deleteTask('${t.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function openTaskModal(id){const t=id?getTasks().find(x=>x.id===id):{};const cs=getCustomers();openModal(id?'编辑任务':'新增任务',`<form id="taskForm"><div class="form-grid">${selectField('关联类型','relatedType',t.relatedType||'其他',['报价单','PI','订单','样品','其他'])}<div class="field"><label>客户</label><select class="select" name="customerId">${cs.map(c=>`<option value="${c.id}" ${t.customerId===c.id?'selected':''}>${esc(c.companyName)}</option>`).join('')}</select></div>${field('关联编号','relatedNo',t.relatedNo||'')}${field('任务标题 *','taskTitle',t.taskTitle||'')}${field('跟进日期','followUpDate',t.followUpDate||today(),'date')}${selectField('状态','status',t.status||'待跟进',['待跟进','已完成'])}${textArea('备注','notes',t.notes||'')}</div></form>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTask('${id||''}')">保存</button>`)}
function saveTask(id){const data=Object.fromEntries(new FormData($('#taskForm')).entries());if(!data.taskTitle.trim())return toast('请填写任务标题');let rows=getTasks();if(id){rows=rows.map(x=>x.id===id?{...x,...data,updatedAt:today()}:x)}else{rows.push({id:uid(),...data,createdAt:today(),updatedAt:today()})}saveTasks(rows);closeModal();toast('任务已保存');render()}
function createAutoTask(customerId,relatedType,relatedNo,title,date,notes){let rows=getTasks();if(rows.some(t=>t.relatedNo===relatedNo&&t.taskTitle===title))return;rows.push({id:uid(),customerId,relatedType,relatedNo,taskTitle:title,followUpDate:date,status:'待跟进',notes,createdAt:today(),updatedAt:today()});saveTasks(rows)}
function completeTask(id){saveTasks(getTasks().map(t=>t.id===id?{...t,status:'已完成',updatedAt:today()}:t));toast('已标记完成');render()}
function deleteTask(id){if(!confirm('确认删除该任务吗？'))return;saveTasks(getTasks().filter(t=>t.id!==id));toast('删除成功');render()}

function dataHTML(){return `<div class="section card"><div class="section-title"><h3>数据管理</h3><span class="badge yellow">本地部署必备</span></div><div class="notice">当前数据只保存在本浏览器。本地部署版本建议定期导出备份；如果清理浏览器缓存、换电脑或换浏览器，数据不会自动同步。</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="exportBackup()">导出完整备份 JSON</button><label class="btn">导入备份 JSON<input type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></label><button class="btn" onclick="exportCSV('customers')">导出客户 CSV</button><button class="btn" onclick="exportCSV('products')">导出产品 CSV</button><button class="btn danger" onclick="resetDemoData()">重置示例数据</button></div></div>`}
function exportBackup(){const data={version:'v0.5.1',exportedAt:new Date().toISOString(),settings:getSettings(),customers:getCustomers(),products:getProducts(),quotations:getQuotations(),invoices:getInvoices(),orders:getOrders(),tasks:getTasks()};downloadFile(`maxgrowth-export-toolbox-backup-${today()}.json`,JSON.stringify(data,null,2))}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(!confirm('确认导入备份吗？当前本地数据会被覆盖。'))return;saveSettings(d.settings||sampleSettings());saveCustomers(d.customers||[]);saveProducts(d.products||[]);saveQuotations(d.quotations||[]);saveInvoices(d.invoices||[]);saveOrders(d.orders||[]);saveTasks(d.tasks||[]);toast('备份已导入');render()}catch(err){toast('导入失败，请检查 JSON 文件')}};reader.readAsText(file)}
function exportCSV(type){const rows=type==='customers'?getCustomers():getProducts();if(!rows.length)return toast('暂无数据');const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\n');downloadFile(`maxgrowth-${type}-${today()}.csv`,csv,'text/csv;charset=utf-8')}

function settingsHTML(){const s=getSettings();return `<form id="settingsForm" class="section card"><div class="section-title"><h3>公司信息</h3><span class="muted">用于报价、PI、CI、PL 自动带出</span></div><div class="form-grid three">${field('公司名称','sellerCompanyName',s.sellerCompanyName)}${field('公司地址','sellerAddress',s.sellerAddress)}${field('联系邮箱','sellerEmail',s.sellerEmail)}${field('联系电话','sellerPhone',s.sellerPhone)}${field('公司网站','sellerWebsite',s.sellerWebsite)}${field('联系人','sellerContactPerson',s.sellerContactPerson)}${field('原产国','defaultOrigin',s.defaultOrigin||'China')}</div><div class="section-title" style="margin-top:22px"><h3>银行信息</h3></div><div class="form-grid three">${field('银行名称','bankName',s.bankName)}${field('账户名称','accountName',s.accountName)}${field('银行账号','accountNo',s.accountNo)}${field('SWIFT Code','swiftCode',s.swiftCode)}${field('银行地址','bankAddress',s.bankAddress)}</div><div class="section-title" style="margin-top:22px"><h3>默认交易条款</h3></div><div class="form-grid three">${selectField('默认币种','defaultCurrency',s.defaultCurrency,['USD','EUR','RMB','GBP'])}${selectField('默认贸易条款','defaultTradeTerm',s.defaultTradeTerm,['FOB','CIF','EXW','DDP'])}${field('默认付款方式','defaultPaymentTerm',s.defaultPaymentTerm)}${field('默认交期','defaultDeliveryTime',s.defaultDeliveryTime)}${field('默认报价有效期','defaultValidity',s.defaultValidity)}</div><div class="row" style="margin-top:20px"><button class="btn primary" type="submit">保存设置</button><button class="btn" type="button" onclick="saveSettings(sampleSettings());render();toast('已重置默认设置')">重置默认值</button></div></form>`}

function docHTML(type,d){if(!d)return '<div class="empty">未找到数据</div>';const s=getSettings(), c=customerObj(d.customerId), items=d.items||[];const title=type==='quote'?'QUOTATION':'PROFORMA INVOICE';const no=type==='quote'?d.quotationNo:d.piNo;const total=type==='quote'?calcQuote(d).totalAmount:d.totalAmount;return `<div class="doc"><h1>${title}</h1><div class="doc-head"><div><h2>Seller</h2><p><strong>${esc(s.sellerCompanyName)}</strong></p><p>${esc(s.sellerAddress)}</p><p>Email: ${esc(s.sellerEmail)}</p><p>Tel: ${esc(s.sellerPhone)}</p><p>Website: ${esc(s.sellerWebsite)}</p></div><div><h2>Buyer</h2><p><strong>${esc(c.companyName)}</strong></p><p>Contact: ${esc(c.contactPerson)}</p><p>Email: ${esc(c.email)}</p><p>WhatsApp: ${esc(c.whatsapp)}</p><p>Address: ${esc(c.address)}</p></div></div><div class="doc-head"><div><p><strong>${type==='quote'?'Quotation No.':'PI No.'}:</strong> ${esc(no)}</p><p><strong>Date:</strong> ${esc(d.date)}</p><p><strong>Currency:</strong> ${esc(d.currency)}</p></div><div><p><strong>Trade Term:</strong> ${esc(d.tradeTerm)}</p><p><strong>Payment Term:</strong> ${esc(d.paymentTerm)}</p><p><strong>Delivery Time:</strong> ${esc(d.deliveryTime)}</p>${type==='quote'?`<p><strong>Validity:</strong> ${esc(d.validity)}</p>`:''}</div></div><table><thead><tr><th>No.</th><th>Product Name</th><th>Model</th><th>Specification</th><th>Quantity</th><th>Unit Price</th><th>Amount</th></tr></thead><tbody>${items.map((i,idx)=>`<tr><td>${idx+1}</td><td>${esc(i.productName)}</td><td>${esc(i.model)}</td><td>${esc(i.specification)}</td><td>${i.quantity} ${esc(i.unit||'pcs')}</td><td>${money(i.unitPrice,d.currency)}</td><td>${money(i.amount,d.currency)}</td></tr>`).join('')}</tbody></table><div class="total">Total Amount: ${money(total,d.currency)}</div>${type==='invoice'?`<div class="bank"><h2>Bank Information</h2><p><strong>Bank Name:</strong> ${esc(s.bankName)}</p><p><strong>Account Name:</strong> ${esc(s.accountName)}</p><p><strong>Account No.:</strong> ${esc(s.accountNo)}</p><p><strong>SWIFT Code:</strong> ${esc(s.swiftCode)}</p><p><strong>Bank Address:</strong> ${esc(s.bankAddress)}</p></div>`:''}<p style="margin-top:18px"><strong>Remarks:</strong> ${esc(d.remarks||'')}</p><div class="sign"><p>${esc(s.sellerCompanyName)}</p><p>Authorized Signature</p></div></div>`}
function toolSetOutput(id,txt){const el=document.getElementById(id);if(el)el.innerHTML=`<div class="emailbox" id="${id}Text">${esc(txt)}</div>`}
function toolCopyOutput(id){const el=document.getElementById(id+'Text')||document.getElementById(id);if(!el)return toast('暂无结果');navigator.clipboard.writeText(el.textContent);toast('内容已复制')}
function bindPageEvents(){const search=$('#searchInput');if(search){search.oninput=()=>{const q=search.value.toLowerCase();$$('#dataTable tbody tr').forEach(tr=>{tr.style.display=tr.dataset.search.includes(q)?'':'none'})}}const sf=$('#settingsForm');if(sf){sf.onsubmit=e=>{e.preventDefault();saveSettings(Object.fromEntries(new FormData(sf).entries()));toast('公司设置已保存');render()}}}
function openModal(title,body,foot=''){$('#modalBackdrop').innerHTML=`<div class="modal"><div class="modal-head no-print"><h3>${title}</h3><button class="btn small" onclick="closeModal()">关闭</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot no-print">${foot}</div>`:''}</div>`;$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show');$('#modalBackdrop').innerHTML=''}
const INVITE_CODE_HASH='TUFYR1JPV1RI'; // MAXGROWTH
const INVITE_FLAG='mgea_invite_unlocked_v056';
function initInviteGate(){
  if(localStorage.getItem(INVITE_FLAG)==='1')return;
  document.body.classList.add('invite-locked');
  const lock=document.getElementById('inviteLock');
  if(lock){lock.classList.add('show');setTimeout(()=>document.getElementById('inviteCodeInput')?.focus(),80)}
}
function unlockInvite(){
  const input=document.getElementById('inviteCodeInput');
  const err=document.getElementById('inviteError');
  const code=(input?.value||'').trim().toUpperCase();
  let ok=false;
  try{ok=btoa(code)===INVITE_CODE_HASH}catch(e){ok=false}
  if(ok){
    localStorage.setItem(INVITE_FLAG,'1');
    document.body.classList.remove('invite-locked');
    document.getElementById('inviteLock')?.classList.remove('show');
    toast('验证成功，欢迎使用');
  }else{
    if(err)err.textContent='邀请码不正确，请联系 Max胥 18080834565（微信同号）获取内测邀请码。';
    input?.focus();
  }
}
function resetInviteGate(){localStorage.removeItem(INVITE_FLAG);location.reload()}
initData();render();initInviteGate();
</script>
